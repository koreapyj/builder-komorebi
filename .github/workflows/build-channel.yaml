name: Build channel

on:
  workflow_call:
    inputs:
      channel:
        description: stable | beta | main
        type: string
        required: true
      upstream_repo:
        type: string
        required: true
      upstream_ref:
        description: refs/tags/X or refs/heads/main (informational; upstream_sha is fetched)
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      release_tag:
        description: this repo's release tag (stable/beta), empty for main
        type: string
        default: ''
      label:
        description: asset label (the release tag, or main-<n>)
        type: string
        required: true
      version_name:
        type: string
        required: true
      variant:
        description: release | debug
        type: string
        required: true
      marker:
        description: name of the build-info artifact that marks this (channel, upstream, builder) as built
        type: string
        required: true
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.channel }} (${{ inputs.upstream_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      # Optional: PKCS12 keystores (keytool's default) use the keystore password for the key too.
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      CHANNEL: ${{ inputs.channel }}
      UPSTREAM_REPO: ${{ inputs.upstream_repo }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      LABEL: ${{ inputs.label }}
      VERSION_NAME: ${{ inputs.version_name }}
      VARIANT: ${{ inputs.variant }}
      BUILDER_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check signing secrets
        if: inputs.variant == 'release'
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::A release build needs the KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS secrets"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch upstream ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          git init -q komorebi
          git -C komorebi remote add origin "https://github.com/$UPSTREAM_REPO.git"
          git -C komorebi fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C komorebi checkout -q FETCH_HEAD
          git -C komorebi submodule update --init --recursive --depth 1
          echo "Building upstream $UPSTREAM_REF at $UPSTREAM_SHA"

      # Read before the patches are applied: the version is upstream's.
      - name: Compute version
        run: |
          set -euo pipefail
          tag=""
          if [ -n "$RELEASE_TAG" ]; then tag=${UPSTREAM_REF#refs/tags/}; fi
          out=$(bash .github/scripts/upstream-version.sh komorebi/app/build.gradle.kts "$BUILD_NUMBER" "$tag")
          get() { sed -n "s/^$1=//p" <<< "$out"; }
          version_code=$(get version_code)
          version_check=$(get version_check)
          if [ "$version_check" = mismatch ]; then
            echo "::warning::upstream tag $tag does not match upstream versionName '$(get upstream_version_name)' (X.Y.Z must be its prefix); this build cannot be published"
          fi
          mkdir -p build-info
          {
            echo "channel=$CHANNEL"
            echo "variant=$VARIANT"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "builder_sha=$BUILDER_SHA"
            echo "release_tag=$RELEASE_TAG"
            echo "version_name=$VERSION_NAME"
            echo "$out"
          } > build-info/build-info.env
          {
            echo "GRADLE_PROPS=-PkomorebiUpdateRepo=$GITHUB_REPOSITORY -PkomorebiUpdateChannel=$CHANNEL" \
              "-PkomorebiReleaseTag=$RELEASE_TAG -PkomorebiBuildNumber=$BUILD_NUMBER" \
              "-PkomorebiVersionCode=$version_code -PkomorebiVersionName=$VERSION_NAME"
          } >> "$GITHUB_ENV"
          {
            echo "### $CHANNEL: upstream \`${UPSTREAM_REF#refs/*/}\` (\`$UPSTREAM_SHA\`), $VARIANT build"
            echo "versionName \`$VERSION_NAME\`, versionCode \`$version_code\` (upstream $(get upstream_version_code) \"$(get upstream_version_name)\"), version check: $version_check"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply patches
        run: |
          set -euo pipefail
          git -C komorebi config user.name "builder-komorebi"
          git -C komorebi config user.email "builder@users.noreply.github.com"
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::error::No patches found in patches/"
            exit 1
          fi
          # glob order (NNNN- prefix) is the series order
          if ! git -C komorebi am "${patches[@]}"; then
            echo "::error::The patch series does not apply to upstream $UPSTREAM_REF ($CHANNEL channel)"
            git -C komorebi am --show-current-patch=diff | head -n 40 || true
            exit 1
          fi

      - name: Prepare fonts
        working-directory: komorebi
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          for w in thin light regular medium semibold bold; do
            cp "app/src/main/assets/fonts/notosansjp_${w}.ttf" "app/src/main/res/font/notosansjp_${w}.ttf"
          done
          # a binary cannot live in a text patch
          cp "$GITHUB_WORKSPACE/fonts/WLCMARU2004ARIBU.TTF" app/src/main/assets/fonts/WLCMARU2004ARIBU.TTF
          # the caption renderer is a submodule, out of reach of the patch series
          bash "$GITHUB_WORKSPACE/third_party/scripts/patch-libaribcaption.sh" app

      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/prebuilt
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('third_party/**') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_BUILD_DIR: ${{ runner.temp }}/ffmpeg-build
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends quilt pkg-config >/dev/null
          bash third_party/scripts/build.sh

      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/prebuilt
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Install FFmpeg
        run: bash third_party/scripts/install-app.sh komorebi/app

      - name: Install Android SDK components
        run: |
          set -eu
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || command -v sdkmanager)
          yes | "$sdkmanager" --licenses >/dev/null || true
          # the NDK is not pinned by the app; AGP auto-installs its default
          "$sdkmanager" "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "cmake;3.30.5" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Unit tests
        working-directory: komorebi
        run: |
          read -ra props <<< "$GRADLE_PROPS"
          ./gradlew --no-daemon "${props[@]}" :app:testDebugUnitTest

      # AGP packages the ABI splits in parallel, and each one tries to create
      # ~/.android/debug.keystore when it is missing; on a fresh machine they race
      # and packageDebug fails. Create it up front.
      - name: Create debug keystore
        if: inputs.variant == 'debug'
        run: |
          set -eu
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10950
          fi

      - name: Build APKs
        working-directory: komorebi
        run: |
          read -ra props <<< "$GRADLE_PROPS"
          ./gradlew --no-daemon "${props[@]}" ":app:assemble${VARIANT^}"

      - name: Sign and collect APKs
        run: bash .github/scripts/collect-apks.sh "$VARIANT" "komorebi/app/build/outputs/apk/$VARIANT" dist "$LABEL"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ inputs.channel }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.marker }}
          path: build-info/build-info.env
          retention-days: 30
          if-no-files-found: error
          overwrite: true
