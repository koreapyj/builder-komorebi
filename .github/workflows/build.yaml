name: Build Komorebi

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build every existing channel even if nothing changed
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)
      && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve upstream refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      on_default_branch: ${{ steps.branch.outputs.on_default_branch }}
      variant: ${{ steps.resolve.outputs.variant }}
      stable_build: ${{ steps.resolve.outputs.stable_build }}
      stable_ref: ${{ steps.resolve.outputs.stable_ref }}
      stable_sha: ${{ steps.resolve.outputs.stable_sha }}
      stable_release_tag: ${{ steps.resolve.outputs.stable_release_tag }}
      stable_label: ${{ steps.resolve.outputs.stable_label }}
      stable_version_name: ${{ steps.resolve.outputs.stable_version_name }}
      stable_marker: ${{ steps.resolve.outputs.stable_marker }}
      beta_build: ${{ steps.resolve.outputs.beta_build }}
      beta_ref: ${{ steps.resolve.outputs.beta_ref }}
      beta_sha: ${{ steps.resolve.outputs.beta_sha }}
      beta_release_tag: ${{ steps.resolve.outputs.beta_release_tag }}
      beta_label: ${{ steps.resolve.outputs.beta_label }}
      beta_version_name: ${{ steps.resolve.outputs.beta_version_name }}
      beta_marker: ${{ steps.resolve.outputs.beta_marker }}
      main_build: ${{ steps.resolve.outputs.main_build }}
      main_ref: ${{ steps.resolve.outputs.main_ref }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
      main_label: ${{ steps.resolve.outputs.main_label }}
      main_version_name: ${{ steps.resolve.outputs.main_version_name }}
      main_marker: ${{ steps.resolve.outputs.main_marker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      # The schedule event payload has no repository object; scheduled runs are always on the default branch.
      - name: Check branch
        id: branch
        env:
          ON_DEFAULT: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
        run: echo "on_default_branch=$ON_DEFAULT" >> "$GITHUB_OUTPUT"

      - name: Resolve channels
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REPO: BeerEgg2001/Komorebi
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          BUILDER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: python3 -I .github/scripts/ci.py resolve

  build-stable:
    name: stable
    needs: resolve
    if: needs.resolve.outputs.stable_build == 'true'
    uses: ./.github/workflows/build-channel.yaml
    secrets: inherit
    with:
      channel: stable
      upstream_repo: BeerEgg2001/Komorebi
      upstream_ref: ${{ needs.resolve.outputs.stable_ref }}
      upstream_sha: ${{ needs.resolve.outputs.stable_sha }}
      release_tag: ${{ needs.resolve.outputs.stable_release_tag }}
      label: ${{ needs.resolve.outputs.stable_label }}
      version_name: ${{ needs.resolve.outputs.stable_version_name }}
      variant: ${{ needs.resolve.outputs.variant }}
      marker: ${{ needs.resolve.outputs.stable_marker }}

  build-beta:
    name: beta
    needs: resolve
    if: needs.resolve.outputs.beta_build == 'true'
    uses: ./.github/workflows/build-channel.yaml
    secrets: inherit
    with:
      channel: beta
      upstream_repo: BeerEgg2001/Komorebi
      upstream_ref: ${{ needs.resolve.outputs.beta_ref }}
      upstream_sha: ${{ needs.resolve.outputs.beta_sha }}
      release_tag: ${{ needs.resolve.outputs.beta_release_tag }}
      label: ${{ needs.resolve.outputs.beta_label }}
      version_name: ${{ needs.resolve.outputs.beta_version_name }}
      variant: ${{ needs.resolve.outputs.variant }}
      marker: ${{ needs.resolve.outputs.beta_marker }}

  build-main:
    name: main
    needs: resolve
    if: needs.resolve.outputs.main_build == 'true'
    uses: ./.github/workflows/build-channel.yaml
    secrets: inherit
    with:
      channel: main
      upstream_repo: BeerEgg2001/Komorebi
      upstream_ref: ${{ needs.resolve.outputs.main_ref }}
      upstream_sha: ${{ needs.resolve.outputs.main_sha }}
      release_tag: ''
      label: ${{ needs.resolve.outputs.main_label }}
      version_name: ${{ needs.resolve.outputs.main_version_name }}
      variant: ${{ needs.resolve.outputs.variant }}
      marker: ${{ needs.resolve.outputs.main_marker }}

  publish-main:
    name: Publish nightly
    needs: [resolve, build-main]
    if: needs.resolve.outputs.on_default_branch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-publish-main
      cancel-in-progress: false
    steps:
      - name: Require release-signed APKs
        if: needs.resolve.outputs.variant != 'release'
        run: |
          echo "::error::The main build is not signed with the release key (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS secrets missing); refusing to publish it."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks-main
          path: dist

      - name: Update the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILDER_SHA: ${{ github.sha }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.main_sha }}
          UPSTREAM_REPO: BeerEgg2001/Komorebi
          LABEL: ${{ needs.resolve.outputs.main_label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/publish-main.sh dist

  release-stable:
    name: Release stable
    needs: [resolve, build-stable]
    if: needs.resolve.outputs.on_default_branch == 'true'
    uses: ./.github/workflows/release.yaml
    permissions:
      actions: read
      contents: write
    with:
      channel: stable
      upstream_repo: BeerEgg2001/Komorebi
      upstream_ref: ${{ needs.resolve.outputs.stable_ref }}
      upstream_sha: ${{ needs.resolve.outputs.stable_sha }}
      release_tag: ${{ needs.resolve.outputs.stable_release_tag }}
      variant: ${{ needs.resolve.outputs.variant }}
      marker: ${{ needs.resolve.outputs.stable_marker }}

  release-beta:
    name: Release beta
    needs: [resolve, build-beta]
    if: needs.resolve.outputs.on_default_branch == 'true'
    uses: ./.github/workflows/release.yaml
    permissions:
      actions: read
      contents: write
    with:
      channel: beta
      upstream_repo: BeerEgg2001/Komorebi
      upstream_ref: ${{ needs.resolve.outputs.beta_ref }}
      upstream_sha: ${{ needs.resolve.outputs.beta_sha }}
      release_tag: ${{ needs.resolve.outputs.beta_release_tag }}
      variant: ${{ needs.resolve.outputs.variant }}
      marker: ${{ needs.resolve.outputs.beta_marker }}
